# =============================================================================
# ProveIT 2026 Demo Stack - MES - Nginx Reverse Proxy Configuration
# =============================================================================
# Description: Nginx configuration for routing traffic to MES Ignition Gateways
# and MCP services using subdomain-based routing.
#
# Subdomains (via Cloudflare Tunnel):
#   ignition-backend.mes.abelara.cloud  -> MES Backend Ignition Gateway (port 8088)
#   ignition-frontend-01.mes.abelara.cloud -> MES Frontend Ignition Gateway (port 8088)
#   mes.mcp.abelara.cloud               -> MES MCP Server (port 3000, Streamable HTTP + OAuth)
#   mes-database.mcp.abelara.cloud      -> Legacy MCP Postgres (port 8000, SSE via Supergateway)
#
# Local Access (path-based):
#   http://localhost:8083/          -> MES Frontend (default)
#   http://localhost:8083/backend/  -> MES Backend
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" host="$host"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Buffer sizes for proxied content
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Client body size (for file uploads, project imports, etc.)
    client_max_body_size 100m;

    # -------------------------------------------------------------------------
    # WebSocket Connection Upgrade Map (must be before server block)
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # -------------------------------------------------------------------------
    # Upstream Definitions
    # -------------------------------------------------------------------------

    # MES Backend Ignition Gateway
    upstream mes-backend {
        server mes-ignition-backend:8088;
        keepalive 32;
    }

    # MES Frontend Ignition Gateway
    upstream mes-frontend {
        server mes-ignition-frontend-01:8088;
        keepalive 32;
    }

    # MES MCP Server (AI/LLM Database Integration via Streamable HTTP + OAuth)
    # New server with MES-specific domain context
    upstream mes-mcp-server {
        server mes-mcp-server:3000;
        keepalive 8;
    }

    # Legacy MCP Postgres Server (generic postgres access)
    # Existing server at mes-database.mcp.abelara.cloud
    upstream mes-mcp-postgres {
        server mes-mcp-postgres:8000;
        keepalive 8;
    }

    # =========================================================================
    # SERVER BLOCK: MES Backend Ignition Gateway
    # =========================================================================
    # Handles: backend.mes.yourdomain.com (via Cloudflare)

    server {
        listen 80;
        server_name ignition-backend.mes.abelara.cloud;

        # Health check endpoint
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Ignition Gateway StatusPing (for health checks)
        location = /StatusPing {
            proxy_pass http://mes-backend/StatusPing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Ignition Gateway WebSocket Support (Perspective)
        location /system/websocket {
            proxy_pass http://mes-backend/system/websocket;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeouts for WebSocket connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Ignition Perspective session WebSocket
        location ~ ^/data/perspective/client/.*$ {
            proxy_pass http://mes-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeouts for WebSocket connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Default route - all other Ignition traffic
        location / {
            proxy_pass http://mes-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support for WebSocket upgrade (fallback)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # SERVER BLOCK: MES Frontend Ignition Gateway
    # =========================================================================
    # Handles: frontend.mes.yourdomain.com (via Cloudflare)

    server {
        listen 80;
        server_name ignition-frontend-01.mes.abelara.cloud;

        # Health check endpoint
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Ignition Gateway StatusPing (for health checks)
        location = /StatusPing {
            proxy_pass http://mes-frontend/StatusPing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Ignition Gateway WebSocket Support (Perspective)
        location /system/websocket {
            proxy_pass http://mes-frontend/system/websocket;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeouts for WebSocket connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Ignition Perspective session WebSocket
        location ~ ^/data/perspective/client/.*$ {
            proxy_pass http://mes-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeouts for WebSocket connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Default route - all other Ignition traffic
        location / {
            proxy_pass http://mes-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support for WebSocket upgrade (fallback)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Legacy MCP Postgres Server (Supergateway + SSE)
    # =========================================================================
    # Handles: mes-database.mcp.abelara.cloud (via Cloudflare)
    # Generic postgres MCP via Supergateway (stdio-to-SSE conversion)
    #
    # Transport: SSE (Server-Sent Events)
    # Endpoints:
    #   /sse              - SSE event stream
    #   /message          - JSON-RPC messages

    server {
        listen 80;
        server_name mes-database.mcp.abelara.cloud;

        # Health check endpoint
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # SSE endpoint for MCP Server-Sent Events
        location /sse {
            proxy_pass http://mes-mcp-postgres/sse;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            # Critical for SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # SSE-specific headers
            proxy_set_header Connection '';
            proxy_set_header Cache-Control 'no-cache';

            # Long timeouts for persistent SSE connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Message endpoint for MCP requests
        location /message {
            proxy_pass http://mes-mcp-postgres/message;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Default route - all other MCP traffic
        location / {
            proxy_pass http://mes-mcp-postgres;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            # Support streaming responses
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # SERVER BLOCK: MES MCP Server (Streamable HTTP + OAuth)
    # =========================================================================
    # Handles: mes.mcp.abelara.cloud (via Cloudflare)
    # Custom MES MCP server with domain-specific context and documentation
    #
    # Transport: Streamable HTTP with OAuth authentication
    # Endpoints:
    #   /mcp              - Main MCP endpoint (POST/GET/DELETE)
    #   /health           - Health check
    #   /oauth/*          - OAuth 2.0 endpoints
    #   /.well-known/*    - OAuth discovery

    server {
        listen 80;
        server_name mes.mcp.abelara.cloud;

        # NGINX health check endpoint (for container orchestration)
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # MCP Server health check (proxy to actual server)
        location = /health {
            proxy_pass http://mes-mcp-server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # -----------------------------------------------------------------
        # OAuth Discovery Endpoints (RFC 8414)
        # -----------------------------------------------------------------
        # These must return the HTTPS URL that clients use to connect

        location /.well-known/ {
            proxy_pass http://mes-mcp-server/.well-known/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # -----------------------------------------------------------------
        # OAuth Authorization & Token Endpoints
        # -----------------------------------------------------------------

        location /oauth/ {
            proxy_pass http://mes-mcp-server/oauth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Dynamic Client Registration (Claude Code uses /register directly)
        location = /register {
            proxy_pass http://mes-mcp-server/register;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # -----------------------------------------------------------------
        # MCP Streamable HTTP Endpoint
        # -----------------------------------------------------------------
        # Handles POST (requests), GET (SSE stream), DELETE (session close)
        # CRITICAL: Buffering must be disabled for SSE streams

        location /mcp {
            proxy_pass http://mes-mcp-server/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            # Pass through MCP session headers
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Last-Event-Id $http_last_event_id;

            # Critical for SSE: disable all buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;

            # SSE needs empty Connection header
            proxy_set_header Connection '';

            # Long timeouts for SSE streams (GET) and normal for POST/DELETE
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Default route - redirect to health or return info
        location / {
            proxy_pass http://mes-mcp-server/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Default (Local Access + Health Check)
    # =========================================================================
    # Handles: localhost:8083 (local development/testing)
    #          Path-based routing for local access

    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint for container health checks
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Frontend Ignition Gateway StatusPing (for health checks)
        location = /StatusPing {
            proxy_pass http://mes-frontend/StatusPing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # ---------------------------------------------------------------------
        # MES Backend Routes (/backend/*) - Local path-based access
        # ---------------------------------------------------------------------
        location = /backend {
            absolute_redirect off;
            return 302 /backend/;
        }

        location /backend/ {
            rewrite ^/backend/(.*)$ /$1 break;

            proxy_pass http://mes-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---------------------------------------------------------------------
        # MES Frontend Routes - Default for local access
        # ---------------------------------------------------------------------
        location /system/websocket {
            proxy_pass http://mes-frontend/system/websocket;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/data/perspective/client/.*$ {
            proxy_pass http://mes-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Default route - MES Frontend Ignition Gateway
        location / {
            proxy_pass http://mes-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

}
