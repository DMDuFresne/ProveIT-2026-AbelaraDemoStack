# =============================================================================
# ProveIT 2026 Demo Stack - Historian - Nginx Reverse Proxy Configuration
# =============================================================================
# Description: Nginx configuration for routing traffic to Historian services
# using subdomain-based routing.
#
# Subdomains (via Cloudflare Tunnel):
#   historian.historian.abelara.cloud   -> Timebase Historian (port 4511)
#   explorer.historian.abelara.cloud    -> Timebase Explorer (port 4531)
#   timebase.mcp.abelara.cloud           -> Historian MCP Server (dedicated subdomain)
#
# MCP Endpoints (via Cloudflare Tunnel with SSE optimization):
#   https://timebase.mcp.abelara.cloud  -> Historian MCP Server (dedicated subdomain)
#   https://historian.historian.abelara.cloud/mcp -> Historian MCP Server (path-based)
#
# Local Access:
#   http://localhost:8086/          -> Timebase Explorer (default)
#   http://localhost:8086/historian -> Timebase Historian
#   http://localhost:8086/historian/mcp -> Historian MCP (SSE optimized)
#
# Direct Access (also available, bypasses Cloudflare):
#   http://<server-ip>:4511/mcp      -> Historian MCP (direct)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" host="$host"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Buffer sizes for proxied content
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Client body size
    client_max_body_size 50m;

    # DNS resolver for dynamic upstream resolution (Docker's internal DNS)
    resolver 127.0.0.11 valid=30s;

    # -------------------------------------------------------------------------
    # WebSocket Connection Upgrade Map (must be before server block)
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # -------------------------------------------------------------------------
    # Upstream Definitions
    # -------------------------------------------------------------------------

    # Timebase Historian - Time Series Database
    upstream timebase-historian {
        server historian-timebase:4511;
        keepalive 32;
    }

    # Timebase Explorer - Web Interface
    upstream timebase-explorer {
        server historian-explorer:4531;
        keepalive 32;
    }

    # =========================================================================
    # SERVER BLOCK: Timebase Historian
    # =========================================================================
    # Handles: historian.historian.abelara.cloud (via Cloudflare)

    server {
        listen 80;
        server_name historian.historian.abelara.cloud;

        # Health check endpoint
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # MCP endpoint - optimized for Server-Sent Events (SSE)
        location /mcp {
            proxy_pass http://timebase-historian;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            # Extended timeouts for long-lived SSE connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            # Increase buffer sizes for streaming
            proxy_buffer_size 4k;
        }

        # Default route - all other traffic to Timebase Historian
        location / {
            proxy_pass http://timebase-historian;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support for WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Historian MCP Server (Dedicated Subdomain)
    # =========================================================================
    # Handles: timebase.mcp.abelara.cloud (via Cloudflare Tunnel)
    # Dedicated subdomain for MCP server access with SSE optimization

    server {
        listen 80;
        server_name timebase.mcp.abelara.cloud;

        # Health check endpoint
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Base MCP endpoint - route root to /mcp
        location = / {
            proxy_pass http://timebase-historian/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffer_size 4k;
        }

        # SSE endpoint for mcp-remote - route /sse to /mcp/sse
        location = /sse {
            proxy_pass http://timebase-historian/mcp/sse;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            # Extended timeouts for long-lived SSE connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            # Increase buffer sizes for streaming
            proxy_buffer_size 4k;
        }

        # All other paths - prepend /mcp to the path
        location / {
            # Rewrite paths to /mcp/path
            rewrite ^/(.*)$ /mcp/$1 break;
            proxy_pass http://timebase-historian;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            # Extended timeouts for long-lived SSE connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            # Increase buffer sizes for streaming
            proxy_buffer_size 4k;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Timebase Explorer
    # =========================================================================
    # Handles: explorer.historian.abelara.cloud (via Cloudflare)

    server {
        listen 80;
        server_name explorer.historian.abelara.cloud;

        # Health check endpoint
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Default route - all traffic to Timebase Explorer
        location / {
            proxy_pass http://timebase-explorer;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support for WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # SERVER BLOCK: Default (Local Access + Health Check)
    # =========================================================================
    # Handles: localhost:8086 (local development/testing)

    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint for container health checks
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Timebase Historian
        location /historian/ {
            rewrite ^/historian/(.*) /$1 break;
            proxy_pass http://timebase-historian;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Historian MCP endpoint (SSE optimized)
        location /historian/mcp {
            rewrite ^/historian/mcp(.*) /mcp$1 break;
            proxy_pass http://timebase-historian;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffer_size 4k;
        }

        # Default route - Timebase Explorer
        location / {
            proxy_pass http://timebase-explorer;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

}
